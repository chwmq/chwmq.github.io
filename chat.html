<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CHWMQ</title>
    <style>
        @font-face {
            font-family: "PeacekeeperEliteBold";
            src: url("Tencent Peacekeeper Elite Bold-subset.ttf") format("truetype");
            font-weight: 900;
            font-style: normal;
            font-display: swap;
            unicode-range: U+0043, U+0048, U+0057, U+004D, U+0051;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                         "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            background-color: #ffffff;
            color: #111111;

            min-height: 100vh;
            min-height: 100svh;

            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(20px, 5vw, 48px) clamp(12px, 4vw, 24px);
        }

        .page {
            width: 100%;
            max-width: 560px;
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(22px, 6vw, 44px);
        }

        .title {
            font-family: "PeacekeeperEliteBold", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: clamp(36px, 11vw, 88px);
            font-weight: 900;
            letter-spacing: clamp(4px, 1.6vw, 14px);
            padding-left: clamp(4px, 1.6vw, 14px);
            color: #111111;
            line-height: 1;
            text-align: center;
            max-width: 100%;
        }

        .form-block {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .form-wrap {
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 2px solid #000000;
            border-radius: 4px;
            background: #ffffff;
            width: 100%;
            padding: 16px;
        }

        .msg-input {
            width: 100%;
            min-width: 0;
            min-height: 140px;
            border: 2px solid #000000;
            border-radius: 4px;
            outline: none;
            font-size: clamp(16px, 4vw, 20px);
            background: transparent;
            padding: 12px 16px;
            font-family: inherit;
            resize: vertical;
        }

        .msg-input::placeholder {
            color: #9a9a9a;
            opacity: 1;
        }

        .submit-btn {
            width: 100%;
            background: #000000;
            border: none;
            cursor: pointer;
            padding: 12px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2px;
            color: #fff;
            font-size: clamp(16px, 4vw, 20px);
            transition: 0.2s;
        }

        .submit-btn:hover {
            background-color: #333333;
        }
        .submit-btn:disabled {
            background-color:#555555;
            cursor:not-allowed;
        }

        /* 蜜罐，隐藏不可见 */
        .botcheck-hp {
            position: absolute;
            left: -9999px;
            opacity:0;
            height:0;
            pointer-events: none;
        }

        /* 横屏手机 / 矮屏幕 */
        @media (max-height: 520px) {
            .page {
                gap: 16px;
            }
            .title {
                font-size: clamp(28px, 8vw, 44px);
                letter-spacing: clamp(3px, 1vw, 8px);
                padding-left: clamp(3px, 1vw, 8px);
            }
            .msg-input {
                min-height: 100px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <h1 class="title">CHWMQ</h1>

        <div class="form-block">
            <div class="form-wrap">
                <form id="msgForm">
                    <!-- Web3Forms密钥 -->
                    <input type="hidden" name="access_key" value="">
                    <!-- 蜜罐防机器人 -->
                    <input type="text" name="botcheck" class="botcheck-hp">
                    <!-- 自动填充数据 -->
                    <input type="hidden" name="name" id="nameInput">
                    <input type="hidden" name="ip" id="ipInput">
                    <input type="hidden" name="device" id="deviceInput">

                    <textarea class="msg-input" name="message" placeholder="写下你的留言……" required></textarea>

                    <button class="submit-btn" type="submit">提交留言</button>
                </form>
            </div>
        </div>
    </main>

<script>
// IP接口列表
const ipApiList = [
  "https://ipv4.ddnsip.cn/json",
  "https://api.ipify.org?format=json",
  "https://ipapi.co/json/"
];
let finalIp = "获取失败";

async function getPublicIP() {
  for(const api of ipApiList) {
    try {
      const res = await fetch(api, {signal:AbortSignal.timeout(4000)});
      if(!res.ok) continue;
      const json = await res.json();
      if(json.ip) return json.ip;
    } catch(e){continue;}
  }
  return "获取失败";
}

// 加载IP和UA，填入name字段
getPublicIP().then(ip=>{
  finalIp = ip;
  document.getElementById('ipInput').value = ip;
  document.getElementById('nameInput').value = ip;
});
document.getElementById('deviceInput').value = navigator.userAgent;

// 表单提交
const form = document.querySelector('#msgForm');
form.addEventListener('submit', async function(e) {
  e.preventDefault();
  const formData = new FormData(form);
  const btn = form.querySelector('.submit-btn');
  btn.disabled = true;
  btn.innerText = "提交中...";
  try{
    const res = await fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      body: formData
    });
    const result = await res.json();
    if(result.success) {
      alert("✅ 密钥验证通过！留言提交成功");
      window.location.href = "https://chwmq.github.io/code?=chat";
    } else {
      alert("❌ 提交失败：" + result.message);
    }
  }catch(err){
    alert("❌ 网络错误，请稍后重试");
  }
  btn.disabled = false;
  btn.innerText = "提交留言";
})
</script>
</body>
</html>
