<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
.form-wrap {
  width: 92%;
  max-width: 520px;
  margin: 30px auto;
  padding: 24px;
  background: #ffffff;
  border-radius: 14px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.08);
  font-family: system-ui, -apple-system, sans-serif;
  box-sizing: border-box;
}
.title {
  text-align: center;
  font-size: 22px;
  font-weight: 600;
  margin: 0 0 20px 0;
  color: #000;
}
.form-item {
  margin-bottom: 16px;
}
.form-item textarea {
  width: 100%;
  box-sizing: border-box;
  padding: 12px 14px;
  border: 1px solid #000000;
  border-radius: 10px;
  font-size: 15px;
  transition: 0.2s border;
  outline: none;
  min-height: 140px;
  resize: vertical;
}
.form-item textarea:focus {
  border-color: #000000;
}
.submit-btn {
  width: 100%;
  padding: 13px;
  background-color: #000000;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
  transition: 0.2s;
}
.submit-btn:hover {
  background-color: #333333;
}
.submit-btn:disabled {
  background-color:#555555;
  cursor:not-allowed;
}
/* 蜜罐，隐藏不可见 */
.botcheck-hp {
  position: absolute;
  left: -9999px;
  opacity:0;
  height:0;
  pointer-events: none;
}
</style>
</head>
<body>

<div class="form-wrap">
  <h2 class="title">"匿名"留言</h2>
  <form id="msgForm">
    <!-- Web3Forms密钥 -->
    <input type="hidden" name="access_key" value="">
    <!-- 蜜罐防机器人 -->
    <input type="text" name="botcheck" class="botcheck-hp">
    <!-- 自动填充数据 -->
    <input type="hidden" name="name" id="nameInput">
    <input type="hidden" name="ip" id="ipInput">
    <input type="hidden" name="device" id="deviceInput">

    <div class="form-item">
      <textarea name="message" placeholder=":(" required></textarea>
    </div>

    <button class="submit-btn" type="submit">提交</button>
  </form>
</div>

<script>
// IP接口列表
const ipApiList = [
  "https://ipv4.ddnsip.cn/json",
  "https://api.ipify.org?format=json",
  "https://ipapi.co/json/"
];
let finalIp = "获取失败";

async function getPublicIP() {
  for(const api of ipApiList) {
    try {
      const res = await fetch(api, {signal:AbortSignal.timeout(4000)});
      if(!res.ok) continue;
      const json = await res.json();
      if(json.ip) return json.ip;
    } catch(e){continue;}
  }
  return "获取失败";
}

// 加载IP和UA，填入name字段
getPublicIP().then(ip=>{
  finalIp = ip;
  document.getElementById('ipInput').value = ip;
  document.getElementById('nameInput').value = ip;
});
document.getElementById('deviceInput').value = navigator.userAgent;

// ====================== Cookie 防频繁提交（冷却60秒，可自行修改） ======================
const COOLDOWN_SECOND = 60;
function getCookie(name) {
  const arr = document.cookie.split('; ');
  for(let item of arr) {
    const [k,v] = item.split('=');
    if(k === name) return v;
  }
  return null;
}
function setCookie(name, value, sec) {
  const d = new Date();
  d.setTime(d.getTime() + sec * 1000);
  document.cookie = `${name}=${value};expires=${d.toUTCString()};path=/`;
}

// 表单提交
const form = document.querySelector('#msgForm');
form.addEventListener('submit', async function(e) {
  e.preventDefault();
  const coolKey = "msg_cooldown";
  const lastTime = getCookie(coolKey);
  if(lastTime) {
    alert("请求过于频繁，请稍后再试！");
    return;
  }

  const formData = new FormData(form);
  const btn = form.querySelector('.submit-btn');
  btn.disabled = true;
  btn.innerText = "提交中...";
  try{
    const res = await fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      body: formData
    });
    const result = await res.json();
    if(result.success) {
      setCookie(coolKey, "1", COOLDOWN_SECOND);
      alert("提交成功");
      // 提交成功自动跳转到主页
      window.location.href = "https://chwmq.github.io/code?=chat";
    } else {
      alert("提交失败：" + result.message);
    }
  }catch(err){
    alert("网络错误，请稍后重试");
  }
  btn.disabled = false;
  btn.innerText = "提交留言";
})
</script>
</body>
</html>
